<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scalping AI Panel</title><style>body{margin:0;background:#081018;color:#eef5fb;font-family:Arial,sans-serif}.w{max-width:1200px;margin:auto;padding:20px}h1{margin:0 0 6px}.sub{color:#91a4b4;margin-bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.g{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.c{background:#101a24;border:1px solid #223240;border-radius:14px;padding:16px}.s3{grid-column:span 3}.s6{grid-column:span 6}.s12{grid-column:span 12}.lab{font-size:12px;color:#91a4b4;text-transform:uppercase}.big{font-size:28px;font-weight:700;margin-top:8px}.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{padding:14px;border:0;border-radius:10px;color:#fff;font-weight:700;cursor:pointer}.start{background:#168d62}.stop{background:#536779}.emg{background:#c43b4b}.close{background:#8e2a34}.ref{background:#164a70}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#ff5d6c;margin-right:8px}.on{background:#20d68f}.bar{height:14px;background:#1d2b37;border-radius:20px;overflow:hidden;margin:8px 0}.fill{height:100%;width:0;background:#20d68f}.mut{color:#91a4b4}.conn{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid #29404f;background:#0d151e}.conn i{width:9px;height:9px;border-radius:50%;display:inline-block;background:#ff5d6c}.conn.online i{background:#20d68f}.conn.reconnecting i{background:#ffb84d;animation:p 1s infinite}@keyframes p{50%{opacity:.35}}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #223240;text-align:left}.log{height:190px;overflow:auto;background:#071019;border:1px solid #223240;border-radius:10px;padding:10px;white-space:pre-wrap;font-family:monospace;font-size:12px}@media(max-width:850px){.s3,.s6{grid-column:span 12}.btns{grid-template-columns:1fr 1fr}}@media(max-width:500px){.btns{grid-template-columns:1fr}}</style></head><body><div class="w"><h1>Scalping AI Control Panel</h1><div class="sub">Binance Futures DEMO <span id="conn" class="conn reconnecting"><i></i><span id="connText">RECONNECTING</span></span></div><div class="g"><div class="c s3"><div class="lab">AUTO</div><div class="big"><span id="dot" class="dot"></span><span id="auto">STOPPED</span></div></div><div class="c s3"><div class="lab">Баланс USDT</div><div id="bal" class="big">—</div></div><div class="c s3"><div class="lab">Доступно</div><div id="avail" class="big">—</div></div><div class="c s3"><div class="lab">Плечо / риск</div><div class="big"><span id="lev">3×</span> / <span id="risk">0.5%</span></div></div><div class="c s12"><div class="lab">Управление</div><div class="btns" style="margin-top:10px"><button class="start" onclick="startBot()">▶ AUTO START</button><button class="stop" onclick="stopBot()">■ STOP AUTO</button><button class="emg" onclick="emergency()">⚠ EMERGENCY STOP</button><button class="close" onclick="closeAll()">✖ CLOSE ALL</button></div></div><div class="c s6"><div class="lab">Лучший сигнал</div><div class="big"><span id="sym">—</span> <span id="act">HOLD</span></div><div class="bar"><div id="fill" class="fill"></div></div><div>Confidence: <b id="conf">—</b> • Порог: <b id="thr">88%</b></div><table><tr><th>Entry</th><td id="entry">—</td><th>SL</th><td id="sl">—</td></tr><tr><th>TP</th><td id="tp">—</td><th>Market</th><td id="mkt">—</td></tr></table></div><div class="c s6"><div class="lab">Открытые позиции</div><table><thead><tr><th>Пара</th><th>Сторона</th><th>Размер</th><th>PnL</th></tr></thead><tbody id="pos"><tr><td colspan="4" class="mut">Нет позиций</td></tr></tbody></table></div><div class="c s12"><button class="ref" onclick="manualRefresh()">↻ Обновить</button><div id="log" class="log" style="margin-top:10px"></div></div></div></div><script>const API='https://scalping-ai-backend-ishr.onrender.com';const F=(n,d=4)=>n==null?'—':Number(n).toLocaleString('ru-RU',{maximumFractionDigits:d});let failCount=0,lastErrorLogged=0,wasOffline=false,refreshTimer=null;function L(x){let e=document.getElementById('log');e.textContent+=`[${new Date().toLocaleTimeString()}] ${x}\n`;e.scrollTop=e.scrollHeight}function setConn(state){const c=document.getElementById('conn'),t=document.getElementById('connText');c.className='conn '+state;t.textContent=state==='online'?'SERVER ONLINE':state==='reconnecting'?'RECONNECTING':'SERVER OFFLINE'}async function C(p,o={},timeout=12000){const ctrl=new AbortController();const tm=setTimeout(()=>ctrl.abort(),timeout);try{let r=await fetch(API+p,{...o,signal:ctrl.signal,headers:{accept:'application/json',...(o.headers||{})}});let j=await r.json();if(!r.ok)throw Error(j.detail||('HTTP '+r.status));return j}finally{clearTimeout(tm)}}function draw(s){let on=!!s.auto_enabled;dot.className='dot '+(on?'on':'');auto.textContent=on?'RUNNING':'STOPPED';bal.textContent=F(s.balance?.balance);avail.textContent=F(s.balance?.available_balance);lev.textContent=(s.leverage||3)+'×';risk.textContent=F((s.risk_per_trade||0)*100,2)+'%';thr.textContent=F((s.confidence_threshold||.88)*100,1)+'%';let q=s.runtime?.last_signal||{};sym.textContent=q.symbol||'—';act.textContent=q.action||'HOLD';let c=Number(q.confidence||0);conf.textContent=F(c*100,2)+'%';fill.style.width=Math.min(100,c*100)+'%';entry.textContent=F(q.entry,8);sl.textContent=F(q.stop_loss,8);tp.textContent=F(q.take_profit,8);mkt.textContent=q.market_state||'—';let ps=s.positions||[];pos.innerHTML=ps.length?ps.map(p=>`<tr><td>${p.symbol}</td><td>${p.position_amt>0?'LONG':'SHORT'}</td><td>${F(Math.abs(p.position_amt),8)}</td><td>${F(p.unrealized_profit)}</td></tr>`).join(''):'<tr><td colspan="4" class="mut">Нет позиций</td></tr>'}function schedule(ms){clearTimeout(refreshTimer);refreshTimer=setTimeout(refresh,ms)}async function refresh(){try{setConn(failCount?'reconnecting':'online');let s=await C('/bot/status');draw(s);if(wasOffline)L('Соединение восстановлено');failCount=0;wasOffline=false;setConn('online');schedule(5000)}catch(e){failCount++;wasOffline=true;setConn(failCount<3?'reconnecting':'offline');const now=Date.now();if(now-lastErrorLogged>30000){L('Связь с сервером потеряна. Повторное подключение...');lastErrorLogged=now}schedule(Math.min(30000,5000*Math.pow(1.6,Math.min(failCount,4))))}}async function manualRefresh(){L('Ручное обновление');failCount=0;setConn('reconnecting');clearTimeout(refreshTimer);refresh()}async function startBot(){if(confirm('Запустить AUTO на DEMO?'))try{setConn('reconnecting');let d=await C('/bot/start?confirm=true',{method:'POST'},20000);draw(d);setConn('online');L('AUTO START');failCount=0;schedule(3000)}catch(e){L('AUTO START ошибка: '+e.message);setConn('reconnecting');schedule(5000)}}async function stopBot(){try{setConn('reconnecting');let d=await C('/bot/stop',{method:'POST'},20000);draw(d.status||d);setConn('online');L('STOP AUTO');failCount=0;schedule(3000)}catch(e){L('STOP AUTO ошибка: '+e.message);setConn('reconnecting');schedule(5000)}}async function emergency(){if(confirm('Запретить новые входы?'))try{setConn('reconnecting');let d=await C('/bot/emergency-stop',{method:'POST'},20000);draw(d.status||d);setConn('online');L('EMERGENCY STOP');failCount=0;schedule(3000)}catch(e){L('EMERGENCY STOP ошибка: '+e.message);setConn('reconnecting');schedule(5000)}}async function closeAll(){if(prompt('Введите CLOSE ALL для подтверждения')==='CLOSE ALL')try{setConn('reconnecting');let d=await C('/bot/close-all?confirm=true',{method:'POST'},20000);draw(d.status||d);setConn('online');L('CLOSE ALL');failCount=0;schedule(3000)}catch(e){L('CLOSE ALL ошибка: '+e.message);setConn('reconnecting');schedule(5000)}}window.addEventListener('online',()=>{L('Интернет на устройстве восстановлен');failCount=0;manualRefresh()});window.addEventListener('offline',()=>{setConn('offline');L('Нет интернета на устройстве')});L('Панель запущена');refresh();</script></body></html>
